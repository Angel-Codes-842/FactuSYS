project_id = "factusys"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
port = 54323

[local_smtp]
port = 54324

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false

# Las keys nuevas no son JWT: el platform verify_jwt no las autentica. Cada
# Function valida al usuario con auth.getUser(jwt) y aplica sus propias reglas.
[functions.factpy-emitter]
verify_jwt = false

[functions.factusys-admin]
verify_jwt = false

[functions.factusys-reportes]
verify_jwt = false
