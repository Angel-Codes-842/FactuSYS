services:
  backend:
    build:
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
    ports:
      - "8000:8000"

  backup:
    build:
      dockerfile: Dockerfile
    entrypoint: []
    command: supercronic /app/crontab
    volumes:
      - ./backend/crontab:/app/crontab
      - backup_volume:/app/backups
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: null
    image: node:22-alpine
    command: sh -c "npm ci && npm run dev"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
